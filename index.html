<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard demo di intelligence editoriale per i club di Serie A.">
  <meta name="theme-color" content="#0b1118">
  <title>Serie A Press Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b1118'/%3E%3Cpath d='M18 45V19h28v8H27v4h16v7H27v7z' fill='%2339e58c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-ribbon"><strong>DEMO DATA</strong><span>Contenuti simulati · Nessuna fonte live collegata</span></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">PI</span><span><b>PRESS INTELLIGENCE</b><small>SERIE A / 2026–27</small></span></div>
      <nav id="mainNav" aria-label="Navigazione principale"></nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span><b>System ready</b><small>Demo adapter attivo</small></span></div>
    </aside>
    <main>
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Apri menu">☰</button>
        <button class="search-trigger" id="searchTrigger"><span>⌕</span><span>Cerca club, giocatori, notizie…</span><kbd>⌘ K</kbd></button>
        <div class="top-actions">
          <label class="time-select"><span>Periodo</span><select id="timeFilter"><option value="24">24 ore</option><option value="72">3 giorni</option><option value="168">7 giorni</option><option value="all">Tutto</option></select></label>
          <button class="icon-btn" id="themeBtn" aria-label="Cambia tema">◐</button>
          <button class="avatar" aria-label="Profilo demo">FA</button>
        </div>
      </header>
      <div class="page" id="app" tabindex="-1"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="searchModal" hidden>
    <section class="search-modal" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
      <div class="search-input-row"><span>⌕</span><input id="globalSearch" autocomplete="off" placeholder="Cerca in tutta la piattaforma…"><button class="text-btn" data-close>ESC</button></div>
      <div id="searchResults" class="search-results"><p class="empty-copy">Inizia a digitare per cercare club, giocatori e intelligence.</p></div>
    </section>
  </div>
  <div class="modal-backdrop" id="detailModal" hidden><section class="detail-modal" id="detailContent" role="dialog" aria-modal="true"></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
